# Alembic config for T-Agent.
# DATABASE_URL is read by migrations/env.py; keep it aligned with storage.db.
# Usage:
#   python -m alembic upgrade head
#   python -m alembic revision -m "xxx" --autogenerate
#   python -m alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp + slug migration filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
